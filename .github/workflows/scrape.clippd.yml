name: Scrape Clippd + 2027 commits (daily)

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-clippd
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Clippd scraper
        run: node scripts/scrape-clippd.mjs --recent
        continue-on-error: true

      - name: Run 2027 commits scraper
        run: node scripts/scrape-commits.mjs

      - name: Commit updated data feeds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/live-results.json public/data/commits.json

          if git diff --staged --quiet; then
            echo "No changes to commit (feeds unchanged)"
            exit 0
          fi

          git commit -m "chore: update live results + 2027 commits $(date -u +%Y-%m-%dT%H:%MZ)"

          if ! git push origin HEAD:main; then
            echo "Push failed — rebasing onto origin/main and retrying"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
