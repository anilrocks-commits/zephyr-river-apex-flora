name: Scrape Clippd (daily)

on:
  schedule:
    # Every day at 06:00 UTC (~2am ET / 4pm AEST next day)
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Clippd scraper
        run: node scripts/scrape-clippd.mjs
        # If the script lives under scripts/ after you move it:
        # run: node scripts/scrape-clippd.mjs

      - name: Commit updated live-results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/live-results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Clippd live-results $(date -u +%Y-%m-%d)"
            git push
          fi
